name: patient-platform

services:
  auth-service-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-db}
      POSTGRES_USER: ${POSTGRES_USER:-admin_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "${AUTH_DB_PORT:-5433}:5432"
    volumes:
      - auth-service-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin_user} -d ${POSTGRES_DB:-db}"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped

  patient-service-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-db}
      POSTGRES_USER: ${POSTGRES_USER:-admin_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "${PATIENT_DB_PORT:-5432}:5432"
    volumes:
      - patient-service-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin_user} -d ${POSTGRES_DB:-db}"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped

  kafka:
    image: bitnami/kafka:3.7
    environment:
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-9094}
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9094}:9094"
    volumes:
      - kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped

  billing-service:
    build:
      context: ./billing-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "${BILLING_HTTP_PORT:-4001}:4001"
      - "${BILLING_GRPC_PORT:-9001}:9001"
    restart: unless-stopped

  auth-service:
    build:
      context: ./auth-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-service-db:5432/${POSTGRES_DB:-db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-admin_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SQL_INIT_MODE: always
      JWT_SECRET: ${JWT_SECRET:-cGF0aWVudC1wbGF0Zm9ybS1sb2NhbC1zZWNyZXQta2V5LXBsZWFzZS1jaGFuZ2UtMjAyNg==}
    depends_on:
      auth-service-db:
        condition: service_healthy
    ports:
      - "${AUTH_HTTP_PORT:-4005}:4005"
    restart: unless-stopped

  patient-service:
    build:
      context: ./patient-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://patient-service-db:5432/${POSTGRES_DB:-db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-admin_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_SQL_INIT_MODE: always
      BILLING_SERVICE_ADDRESS: billing-service
      BILLING_SERVICE_GRPC_PORT: 9001
    depends_on:
      patient-service-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      billing-service:
        condition: service_started
    ports:
      - "${PATIENT_HTTP_PORT:-4000}:4000"
    restart: unless-stopped

  analytics-service:
    build:
      context: ./analytics-service
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${ANALYTICS_HTTP_PORT:-4002}:4002"
    restart: unless-stopped

  api-gateway:
    build:
      context: ./api-gateway
    environment:
      AUTH_SERVICE_URI: http://auth-service:4005
      AUTH_SERVICE_URL: http://auth-service:4005
      PATIENT_SERVICE_URI: http://patient-service:4000
    depends_on:
      auth-service:
        condition: service_started
      patient-service:
        condition: service_started
    ports:
      - "${GATEWAY_HTTP_PORT:-4004}:4004"
    restart: unless-stopped

  web:
    build:
      context: ./web
    depends_on:
      api-gateway:
        condition: service_started
    ports:
      - "${WEB_HTTP_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  auth-service-db-data:
  patient-service-db-data:
  kafka-data:
